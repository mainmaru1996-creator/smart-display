:root {
  color-scheme: dark;
  --bg: #000;
  --fg: #f0f0f0;
  --muted: #8a8a8a;
  --accent: #5fb3ff;
  --sunday: #ff8a8a;
  --saturday: #8ab4ff;
  --panel-bg: #111318;
  --border: #2a2d33;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  overflow: hidden;
}

body.night {
  filter: brightness(0.6);
}

.dashboard {
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(1rem, 3vh, 3rem);
  padding: clamp(1rem, 4vw, 3rem);
}

.clock {
  text-align: center;
}

.clock-time {
  font-size: clamp(4rem, 16vw, 12rem);
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
}

.clock-date {
  margin-top: 0.5rem;
  font-size: clamp(1rem, 3vw, 2rem);
  color: var(--muted);
}

.panels {
  display: flex;
  flex-wrap: wrap;
  gap: clamp(1rem, 3vw, 2.5rem);
  width: 100%;
  max-width: 1100px;
  justify-content: center;
}

.panel {
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 1rem;
  padding: clamp(1rem, 2.5vw, 1.75rem);
  flex: 1 1 320px;
  min-width: 280px;
}

.panel-title {
  margin: 0 0 0.75rem;
  font-size: clamp(1rem, 2vw, 1.4rem);
  color: var(--muted);
  font-weight: 500;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 0.35rem;
  text-align: center;
}

.calendar-weekday {
  font-size: clamp(0.75rem, 1.5vw, 1rem);
  color: var(--muted);
  padding-bottom: 0.25rem;
}

.calendar-day {
  padding: 0.4rem 0;
  border-radius: 0.5rem;
  font-size: clamp(0.85rem, 1.8vw, 1.1rem);
}

.calendar-weekday.sunday,
.calendar-day.sunday {
  color: var(--sunday);
}

.calendar-weekday.saturday,
.calendar-day.saturday {
  color: var(--saturday);
}

.calendar-day.today {
  background: var(--accent);
  color: #001528;
  font-weight: 700;
}

.weather-location {
  font-size: clamp(1rem, 2vw, 1.3rem);
  color: var(--muted);
}

.weather-temp {
  font-size: clamp(2.5rem, 6vw, 4rem);
  font-weight: 700;
  line-height: 1.1;
}

.weather-desc {
  font-size: clamp(0.9rem, 2vw, 1.2rem);
  color: var(--muted);
  margin-bottom: 0.75rem;
}

.weather-forecast {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
}

.forecast-day {
  flex: 1 1 60px;
  text-align: center;
  font-size: clamp(0.75rem, 1.6vw, 0.95rem);
  color: var(--muted);
}

.forecast-day .forecast-temp {
  color: var(--fg);
  font-weight: 600;
}

.icon-button {
  position: fixed;
  top: 1rem;
  right: 1rem;
  z-index: 10;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 50%;
  width: 2.5rem;
  height: 2.5rem;
  font-size: 1.2rem;
  cursor: pointer;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
}

.modal.hidden {
  display: none;
}

.modal-content {
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 1rem;
  padding: 1.5rem;
  width: min(90vw, 360px);
}

.modal-content label {
  display: block;
  margin-bottom: 0.5rem;
  color: var(--muted);
  font-size: 0.9rem;
}

.modal-content input {
  width: 100%;
  padding: 0.6rem 0.75rem;
  border-radius: 0.5rem;
  border: 1px solid var(--border);
  background: #0a0b0e;
  color: var(--fg);
  font-size: 1rem;
}

.settings-error {
  color: var(--sunday);
  font-size: 0.85rem;
  min-height: 1.2em;
  margin-top: 0.5rem;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 0.5rem;
  margin-top: 1rem;
}

.modal-actions button {
  padding: 0.5rem 1rem;
  border-radius: 0.5rem;
  border: 1px solid var(--border);
  background: #1a1d23;
  color: var(--fg);
  cursor: pointer;
}

#settings-save {
  background: var(--accent);
  color: #001528;
  border-color: var(--accent);
  font-weight: 600;
}

@media (orientation: portrait) {
  .panels {
    flex-direction: column;
  }
}
