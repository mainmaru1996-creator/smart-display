
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>呼び出し表示</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: none;
  }

  .back-link {
    position: fixed;
    top: 0.75rem;
    left: 0.75rem;
    z-index: 10;
    color: #ccc;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 50%;
    width: 2.25rem;
    height: 2.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 1.1rem;
    opacity: 0.35;
    transition: opacity 0.3s ease;
  }

  .back-link:hover,
  .back-link:focus-visible {
    opacity: 1;
  }
</style>
</head>
<body>
  <a class="back-link" href="./index.html" aria-label="時計画面に戻る">←</a>
  <iframe src="https://waiter1.smaregi.jp/control" title="呼び出し表示" allow="fullscreen"></iframe>
  <script type="module" src="./js/waiter.js"></script>
</body>
</html>
